name: Layerling-Webseite

# Baut Layerling (zurzeit aus marcus040473/layerling_msto, Zweig
# "claude/hopeful-dirac-sj8lu3", sonst marcus040473/layerling, Zweig "marcus") als statische
# Fassung und stellt sie unter https://marcus040473.github.io bereit.
# Läuft von Hand (Actions -> Layerling-Webseite -> Run workflow), bei jeder
# Änderung in diesem Repo und einmal in der Nacht.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Bauen
    runs-on: ubuntu-latest
    steps:
      # Vorübergehend: der Arbeitszweig aus layerling_msto (marcus + Stefans
      # 1.166.0 + Vasen-Designer mit Bild/Text und neuen Mustern), bis er in
      # marcus040473/layerling, Zweig marcus, zusammengeführt ist. Zurück
      # geht es mit: repository marcus040473/layerling, ref marcus.
      - name: Layerling holen (Arbeitszweig aus layerling_msto)
        uses: actions/checkout@v7
        with:
          repository: marcus040473/layerling_msto
          ref: claude/hopeful-dirac-sj8lu3

      # Teständerungen: jede Datei in testaenderungen/ dieses Repos ist eine
      # Änderung, die noch nicht bei Stefan ist, aber hier schon ausprobiert
      # werden soll (z. B. 1917-gridfinity-groesse.patch). Passt eine nicht
      # mehr, wird sie übersprungen und unter Actions als Warnung gezeigt;
      # die Seite wird trotzdem gebaut. Ausbauen: die Datei löschen.
      - name: Teständerungen holen
        uses: actions/checkout@v7
        with:
          path: .seite

      - name: Teständerungen dazunehmen
        run: |
          shopt -s nullglob
          for patch in .seite/testaenderungen/*.patch; do
            if git -c user.name="Layerling-Webseite" -c user.email="actions@github.com" am --3way "$patch"; then
              echo "Dazugenommen: $(basename "$patch")"
            else
              git am --abort || true
              echo "::warning::Teständerung passt nicht mehr und wurde übersprungen: $(basename "$patch")"
            fi
          done
          rm -rf .seite

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Statische Fassung bauen
        run: npm run export
        env:
          # Der Link "auf GitHub" unten auf der Seite zeigt auf den Quellcode
          # dieser Fassung (AGPL-3.0: wer eine veränderte Fassung im Netz
          # betreibt, bietet ihren Quellcode an).
          NEXT_PUBLIC_SOURCE_CODE_URL: https://github.com/marcus040473/layerling_msto/tree/claude/hopeful-dirac-sj8lu3

      - name: Pages vorbereiten
        uses: actions/configure-pages@v6

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/.next-export

  deploy:
    name: Veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages stellen
        id: deployment
        uses: actions/deploy-pages@v5
